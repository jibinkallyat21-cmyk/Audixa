<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>AUDIT 360 – Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #020914;
    font-family: 'Inter', system-ui, sans-serif;
  }

  /* ── Keyframes ───────────────────────────────────────────────── */
  @keyframes a360-fadein {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes a360-cardslide {
    from { opacity: 0; transform: translateX(28px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes a360-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(247,25,61,0.18), 0 4px 20px rgba(0,0,18,0.6); }
    50%       { box-shadow: 0 0 0 6px rgba(247,25,61,0),  0 4px 20px rgba(0,0,18,0.6); }
  }
  @keyframes a360-bgwarp {
    0%, 100% { transform: perspective(1200px) rotateX(0deg); }
    50%       { transform: perspective(1200px) rotateX(3deg); }
  }
  @keyframes a360-ambient {
    0%   { transform: translate(0px, 0px); }
    30%  { transform: translate(16px, -10px); }
    65%  { transform: translate(-12px, 14px); }
    100% { transform: translate(0px, 0px); }
  }
  @keyframes a360-env1 {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-28px); }
  }
  @keyframes a360-env2 {
    0%, 100% { transform: translate(0, 0); }
    50%       { transform: translate(22px, -10px); }
  }
  @keyframes a360-env3 {
    0%, 100% { transform: translateX(0); }
    50%       { transform: translateX(-18px); }
  }
  @keyframes a360-ticker {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  @keyframes csg-float {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-9px); }
  }
  @keyframes csg-particle {
    0%, 100% { transform: translate(-50%,-50%) scale(0.72); opacity: 0.42; }
    50%       { transform: translate(-50%,-50%) scale(1.32); opacity: 1; }
  }
  @keyframes eco-orb-breathe {
    0%, 100% { opacity: 0.92; }
    50%       { opacity: 1; }
  }

  /* ── Animations applied ──────────────────────────────────────── */
  .a360-brand  { animation: a360-fadein 0.7s ease both; }
  .a360-hl     { animation: a360-fadein 0.75s 0.12s ease both; }
  .a360-sep    { animation: a360-fadein 0.6s 0.22s ease both; }
  .a360-gp     { animation: a360-fadein 0.6s 0.32s ease both; }
  .a360-card   { animation: a360-cardslide 0.75s 0.1s ease both; }
  .a360-ai     { animation: a360-pulse 2.8s 1s ease-in-out infinite; }
  .a360-bgwarp { animation: a360-bgwarp 40s ease-in-out infinite; transform-origin: center 62%; }
  .a360-ambient { animation: a360-ambient 28s ease-in-out infinite; }
  .a360-env1   { animation: a360-env1 14s ease-in-out infinite; }
  .a360-env2   { animation: a360-env2 18s -3.5s ease-in-out infinite; }
  .a360-env3   { animation: a360-env3 15s -6.2s ease-in-out infinite; }
  .a360-ticker-track { animation: a360-ticker 35s linear infinite; display: inline-flex; white-space: nowrap; }
  .csg-float-anim { animation: csg-float 7s ease-in-out infinite; }
  .eco-orb-g   { animation: eco-orb-breathe 9s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .a360-bgwarp, .a360-ambient, .a360-env1, .a360-env2, .a360-env3,
    .a360-ticker-track, .csg-float-anim, .eco-orb-g { animation: none !important; }
  }

  /* ── Input / button interactions ─────────────────────────────── */
  .a360-inp {
    width: 100%; box-sizing: border-box;
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(80,120,200,0.25);
    border-radius: 7px;
    padding: 9px 12px 9px 38px;
    color: #e8f0fc;
    font-size: clamp(10px, 0.9vw, 13px);
    font-family: 'Inter', system-ui, sans-serif;
    caret-color: #4a9eff;
    transition: border-color 0.18s, background 0.18s;
    outline: none;
  }
  .a360-inp:focus { border-color: rgba(80,130,220,0.55) !important; background: rgba(255,255,255,0.09) !important; }

  .a360-inp-pr { padding-right: clamp(38px, 3.8vw, 54px) !important; }

  select.a360-inp { appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: clamp(26px,2.5vw,36px); }
  select.a360-inp option { background: #08182A; color: #e8f0fc; }

  .a360-signin {
    background: linear-gradient(135deg, #F7193D 0%, #C9102F 100%);
    border: none; border-radius: 7px;
    padding: clamp(9px,1vw,13px);
    color: #fff; font-weight: 700;
    font-size: clamp(11px,1vw,14px);
    font-family: 'Inter', system-ui, sans-serif;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    box-shadow: 0 4px 20px rgba(247,25,61,0.38);
    transition: opacity 0.15s, box-shadow 0.15s;
    width: 100%;
  }
  .a360-signin:hover { opacity: 0.88; box-shadow: 0 8px 28px rgba(247,25,61,0.5) !important; }
  .a360-signin:hover .a360-arrow { transform: translateX(3px); }
  .a360-arrow { transition: transform 0.15s ease; display: flex; }

  .a360-demo {
    background: transparent;
    border: 1px solid rgba(247,25,61,0.38);
    border-radius: 7px;
    padding: clamp(9px,1vw,13px);
    color: #e8f0fc; font-weight: 600;
    font-size: clamp(11px,1vw,14px);
    font-family: 'Inter', system-ui, sans-serif;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: border-color 0.15s, background 0.15s;
    width: 100%;
  }
  .a360-demo:hover { background: rgba(247,25,61,0.08) !important; border-color: rgba(247,25,61,0.65) !important; }

  .a360-tab {
    background: none; border: none; cursor: pointer;
    padding: clamp(4px,0.5vw,7px) clamp(4px,0.45vw,7px);
    font-size: clamp(10px,0.9vw,13px);
    font-family: 'Inter', system-ui, sans-serif;
    outline: none; white-space: nowrap;
    transition: color 0.15s;
    margin-bottom: -1px;
  }
  .a360-tab:hover { color: rgba(220,235,255,0.9) !important; }

  .a360-fp-link {
    background: none; border: none; cursor: pointer; padding: 0;
    color: #F7193D; font-size: clamp(9px,0.78vw,11px);
    font-family: 'Inter', system-ui, sans-serif; font-weight: 500;
  }

  .eco-node { transition: opacity 0.2s ease; }
  .eco-node:hover { opacity: 0.9; }
  .eco-icon-ring { transition: border-color 0.2s ease, box-shadow 0.2s ease; }
  .eco-node:hover .eco-icon-ring {
    border-color: rgba(240,55,75,0.90) !important;
    box-shadow: 0 0 22px rgba(220,40,60,0.52), inset 0 0 10px rgba(220,40,60,0.14) !important;
  }

  /* ── Label ───────────────────────────────────────────────────── */
  .a360-lbl {
    font-size: clamp(9px,0.78vw,11px);
    color: rgba(170,200,235,0.78);
    font-weight: 600; letter-spacing: 0.04em;
    display: block; margin-bottom: 4px;
    font-family: 'Inter', system-ui, sans-serif;
  }

  /* ── Icon wrap ───────────────────────────────────────────────── */
  .a360-icon-wrap {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    pointer-events: none; display: flex; align-items: center;
  }

  /* ── Visible / hidden helpers ───────────────────────────────── */
  .hidden { display: none !important; }

  /* ── Error alert ─────────────────────────────────────────────── */
  .a360-err {
    background: rgba(140,15,25,0.82);
    border: 1px solid rgba(255,80,90,0.3);
    border-radius: 6px; padding: 5px 10px;
    color: #fff; font-size: clamp(9px,0.78vw,11px);
    font-family: 'Inter', system-ui, sans-serif;
  }

  /* ── Success message ─────────────────────────────────────────── */
  .a360-success {
    background: rgba(20,60,30,0.7);
    border: 1px solid rgba(60,200,100,0.3);
    border-radius: 6px; padding: clamp(8px,0.9vw,12px);
    color: rgba(140,220,160,0.95); font-size: clamp(9px,0.8vw,12px);
    font-family: 'Inter', system-ui, sans-serif; text-align: center;
  }

  /* ── Responsive ─────────────────────────────────────────────── */
  @media (max-width: 480px) {
    body { overflow-y: auto; height: auto; min-height: 100vh; }
    #layout { flex-direction: column; height: auto; padding: clamp(20px,5vw,32px) !important; align-items: center !important; }
    #left-panel { display: none !important; }
    #right-panel { flex: none !important; width: 100% !important; max-width: 420px !important; }
    .a360-card { max-height: none !important; }
  }
</style>
</head>
<body>

<!-- ── ROOT ──────────────────────────────────────────────────────── -->
<div id="root" style="width:100vw;height:100vh;overflow:hidden;position:relative;background:#020914;">

  <!-- LAYER 1: Background photo -->
  <div class="a360-bgwarp" style="position:absolute;inset:0;will-change:transform;">
    <img id="bg-img" src="/bg/audit360.webp" alt=""
      style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;transform:scale(1.06);will-change:transform;pointer-events:none;"/>
  </div>

  <!-- LAYER 1b: Deep bg plane -->
  <div id="deep-plane" style="position:absolute;inset:-6px;background:linear-gradient(155deg,rgba(8,20,46,0.055) 0%,transparent 42%,transparent 58%,rgba(3,10,26,0.04) 100%);pointer-events:none;will-change:transform;"></div>

  <!-- LAYER 2b: Near-mid plane -->
  <div id="near-plane" style="position:absolute;inset:-12px;background:radial-gradient(ellipse 52% 34% at 36% 54%,rgba(12,28,58,0.055) 0%,transparent 66%);pointer-events:none;will-change:transform;"></div>

  <!-- Ambient atmospheric gradient -->
  <div class="a360-ambient" style="position:absolute;inset:-32px;background:radial-gradient(ellipse 65% 50% at 38% 32%,rgba(10,24,52,0.16) 0%,transparent 65%),radial-gradient(ellipse 50% 38% at 68% 72%,rgba(3,10,26,0.12) 0%,transparent 60%),radial-gradient(ellipse 90% 70% at 50% 50%,rgba(6,16,42,0.08) 0%,transparent 80%);pointer-events:none;will-change:transform;"></div>

  <!-- LAYER 2: Mid plane -->
  <div id="mid-plane" style="position:absolute;inset:-10px;background:linear-gradient(135deg,rgba(15,35,60,0.07) 0%,transparent 45%,transparent 55%,rgba(5,15,30,0.05) 100%);pointer-events:none;will-change:transform;"></div>

  <!-- LAYER 3: Foreground depth -->
  <div id="fg-plane" style="position:absolute;inset:-10px;background:radial-gradient(ellipse 88% 72% at 48% 44%,transparent 28%,rgba(2,9,20,0.06) 100%);pointer-events:none;will-change:transform;"></div>

  <!-- LAYER 4: City-light bloom -->
  <div id="atm-plane" style="position:absolute;inset:-10px;background:radial-gradient(ellipse 42% 28% at 42% 64%,rgba(190,140,60,0.022) 0%,transparent 68%);pointer-events:none;will-change:transform;"></div>

  <!-- Environmental lighting -->
  <div class="a360-env1" style="position:absolute;inset:-32px;background:linear-gradient(180deg,transparent 43%,rgba(182,208,238,0.028) 50%,transparent 57%);pointer-events:none;will-change:transform;"></div>
  <div class="a360-env2" style="position:absolute;inset:-32px;background:linear-gradient(128deg,transparent 30%,rgba(198,218,242,0.022) 44%,transparent 58%);pointer-events:none;will-change:transform;"></div>
  <div class="a360-env3" style="position:absolute;inset:-32px;background:radial-gradient(ellipse 58% 24% at 40% 74%,rgba(208,168,92,0.024) 0%,transparent 68%);pointer-events:none;will-change:transform;"></div>

  <!-- Overlays -->
  <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 110% 90% at 42% 50%,transparent 55%,rgba(1,6,16,0.55) 100%);"></div>
  <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(1,6,16,0.18) 0%,transparent 14%,transparent 82%,rgba(1,6,16,0.50) 100%);"></div>
  <div style="position:absolute;top:0;right:0;bottom:0;width:42%;pointer-events:none;background:linear-gradient(90deg,transparent 0%,rgba(2,9,22,0.60) 30%,rgba(2,9,22,0.84) 70%,rgba(1,6,16,0.92) 100%);"></div>

  <!-- LAYER 5: Page content -->
  <div id="layout" style="position:relative;z-index:10;width:100%;height:100%;display:flex;align-items:stretch;padding:clamp(24px,3vh,44px) clamp(20px,2.5vw,52px);gap:3%;">

    <!-- LEFT PANEL — hidden spacer; photo supplies visuals -->
    <div id="left-panel" style="flex:0 0 66%;width:66%;position:relative;visibility:hidden;pointer-events:none;"></div>

    <!-- RIGHT PANEL — login card -->
    <div id="right-panel" style="flex:0 0 31%;width:31%;display:flex;align-items:center;padding-left:1%;">
      <div style="position:relative;width:100%;">

        <!-- Ghost card 2 (furthest back) -->
        <div id="ghost2" style="position:absolute;inset:0;background:rgba(2,8,20,0.48);border:1px solid rgba(130,170,220,0.14);border-top:1px solid rgba(180,215,255,0.20);border-radius:clamp(10px,1vw,16px);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 50px rgba(0,4,14,0.62);will-change:transform;pointer-events:none;transform:translate(20px,28px);"></div>
        <!-- Ghost card 1 (mid depth) -->
        <div id="ghost1" style="position:absolute;inset:0;background:rgba(3,10,24,0.60);border:1px solid rgba(130,170,220,0.16);border-top:1px solid rgba(180,215,255,0.24);border-radius:clamp(10px,1vw,16px);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 36px rgba(0,4,14,0.52);will-change:transform;pointer-events:none;transform:translate(10px,14px);"></div>

        <!-- 3D tilt wrapper -->
        <div id="card-tilt" style="width:100%;will-change:transform;transform-origin:center center;">

          <!-- Main card -->
          <div class="a360-card" style="width:100%;background:rgba(3,11,26,0.72);border:1px solid rgba(130,170,220,0.18);border-top:1px solid rgba(180,215,255,0.28);border-left:1px solid rgba(140,180,230,0.14);border-radius:clamp(10px,1vw,16px);backdrop-filter:blur(22px) saturate(1.6) brightness(1.05);-webkit-backdrop-filter:blur(22px) saturate(1.6) brightness(1.05);box-shadow:0 0 0 1px rgba(100,150,220,0.07),0 4px 12px rgba(0,4,14,0.55),0 18px 55px rgba(0,6,22,0.60),0 48px 100px rgba(0,3,14,0.38),inset 0 1px 0 rgba(220,238,255,0.10),inset 1px 0 0 rgba(200,220,255,0.05),inset 0 -1px 0 rgba(0,0,0,0.25);display:flex;flex-direction:column;padding:clamp(18px,2.2vw,32px);gap:clamp(8px,0.9vw,13px);overflow-y:auto;overflow-x:hidden;max-height:calc(100vh - clamp(24px,3vh,44px) * 2);">

            <!-- Card header -->
            <div>
              <h2 id="card-title" style="margin:0;font-size:clamp(16px,1.9vw,26px);font-weight:800;color:#F5F7FA;font-family:'Inter',system-ui,sans-serif;line-height:1.15;">Welcome back</h2>
              <p id="card-sub" style="margin:clamp(2px,0.3vw,5px) 0 0;font-size:clamp(9px,0.8vw,12px);color:rgba(145,164,184,0.82);font-family:'Inter',system-ui,sans-serif;">Sign in to your AUDIT 360 workspace</p>
            </div>

            <!-- FORGOT PASSWORD PANEL (hidden by default) -->
            <div id="fp-panel" class="hidden" style="display:flex;flex-direction:column;gap:clamp(8px,0.9vw,13px);">
              <div>
                <label class="a360-lbl">Work email</label>
                <div style="position:relative;">
                  <span class="a360-icon-wrap">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(140,170,220,0.65)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
                  </span>
                  <input id="fp-email" type="email" placeholder="you@analytix.com" autocomplete="email" class="a360-inp"/>
                </div>
              </div>
              <div id="fp-success" class="hidden a360-success">Reset link sent — check your inbox.</div>
              <button id="fp-send-btn" type="button" class="a360-signin" onclick="sendReset()">Send reset link</button>
              <button type="button" onclick="showLogin()" style="background:none;border:none;cursor:pointer;color:#F7193D;font-size:clamp(9px,0.78vw,11px);font-family:'Inter',system-ui,sans-serif;font-weight:500;display:flex;align-items:center;gap:4px;padding:0;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
                Back to sign in
              </button>
            </div>

            <!-- LOGIN PANEL (visible by default) -->
            <div id="login-panel">

              <!-- Tabs -->
              <div style="border-bottom:1px solid rgba(65,105,200,0.18);display:flex;align-items:flex-end;gap:2px;">
                <button type="button" id="tab-client" class="a360-tab" onclick="switchTab('client')"
                  style="font-weight:700;color:#F5F7FA;border-bottom:2px solid #F7193D;">Client Portal</button>
                <span style="color:rgba(90,120,180,0.3);font-size:clamp(10px,0.9vw,13px);padding-bottom:6px;user-select:none;">|</span>
                <button type="button" id="tab-team" class="a360-tab" onclick="switchTab('team')"
                  style="font-weight:400;color:rgba(145,164,184,0.55);border-bottom:2px solid transparent;">Analytix Team</button>
              </div>

              <!-- Work email -->
              <div style="margin-top:clamp(8px,0.9vw,13px);">
                <label class="a360-lbl">Work email</label>
                <div style="position:relative;">
                  <span class="a360-icon-wrap">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(140,170,220,0.65)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
                  </span>
                  <input id="email" type="email" placeholder="you@analytix.com" autocomplete="username" class="a360-inp"/>
                </div>
              </div>

              <!-- Password -->
              <div style="margin-top:clamp(8px,0.9vw,13px);">
                <label class="a360-lbl">Password</label>
                <div style="position:relative;">
                  <span class="a360-icon-wrap">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(140,170,220,0.65)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="11" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                  </span>
                  <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" class="a360-inp a360-inp-pr"/>
                  <button type="button" id="show-pw-btn" onclick="togglePw()"
                    style="position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0;font-size:clamp(9px,0.82vw,12px);font-weight:600;color:#F7193D;font-family:'Inter',system-ui,sans-serif;">Show</button>
                </div>
              </div>

              <!-- Forgot password -->
              <div style="text-align:right;margin-top:-4px;margin-bottom:clamp(8px,0.9vw,13px);">
                <button type="button" class="a360-fp-link" onclick="showForgotPassword()">Forgot password?</button>
              </div>

              <!-- Sign In -->
              <button type="button" class="a360-signin" onclick="doSignIn()">
                <span class="a360-arrow">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </span>
                Sign In
              </button>

              <!-- Error -->
              <div id="signin-err" class="a360-err hidden" role="alert"></div>

              <!-- Create account (team tab only) -->
              <div id="create-account-row" class="hidden" style="display:flex;align-items:center;justify-content:center;gap:6px;border-top:1px solid rgba(65,105,200,0.14);padding-top:clamp(5px,0.6vw,8px);">
                <span style="font-size:clamp(9px,0.78vw,11px);color:rgba(145,164,184,0.65);font-family:'Inter',system-ui,sans-serif;">New to Analytix Team?</span>
                <a href="#" style="font-size:clamp(9px,0.78vw,11px);color:#F7193D;font-family:'Inter',system-ui,sans-serif;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:3px;">
                  Create account
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </a>
              </div>

            </div><!-- /login-panel -->

            <!-- DEMO ACCESS divider -->
            <div style="display:flex;align-items:center;gap:8px;margin-top:2px;">
              <div style="flex:1;height:1px;background:rgba(65,105,200,0.16);"></div>
              <span style="font-size:clamp(7px,0.65vw,9px);letter-spacing:0.16em;color:rgba(97,117,139,0.65);font-family:'Inter',system-ui,sans-serif;font-weight:600;">DEMO ACCESS</span>
              <div style="flex:1;height:1px;background:rgba(65,105,200,0.16);"></div>
            </div>

            <!-- Preview as role -->
            <div>
              <label class="a360-lbl">Preview as role</label>
              <div style="position:relative;">
                <span class="a360-icon-wrap">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(140,170,220,0.65)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                </span>
                <select id="demo-role" class="a360-inp">
                  <option value="partner">Partner</option>
                  <option value="engagement-manager">Engagement Manager</option>
                  <option value="senior-auditor">Senior Auditor</option>
                  <option value="auditor">Auditor</option>
                  <option value="client">Client</option>
                  <option value="admin">Admin</option>
                </select>
                <span style="position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(140,170,220,0.65)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </span>
              </div>
            </div>

            <!-- Enter Demo -->
            <button type="button" class="a360-demo" onclick="enterDemo()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
              Enter Demo
            </button>

            <!-- Secure footer -->
            <div style="display:flex;align-items:center;justify-content:center;gap:5px;padding-top:2px;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="rgba(110,160,210,0.55)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="11" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              <span style="font-size:clamp(8px,0.68vw,10px);color:rgba(97,117,139,0.6);font-family:'Inter',system-ui,sans-serif;letter-spacing:0.04em;">Secure encrypted connection</span>
            </div>

          </div><!-- /main card -->
        </div><!-- /tilt wrapper -->
      </div><!-- /card stack -->
    </div><!-- /right panel -->
  </div><!-- /layout -->

  <!-- Floating AI assistant -->
  <button type="button" class="a360-ai"
    style="position:absolute;bottom:24px;right:24px;z-index:50;width:44px;height:44px;border-radius:50%;background:rgba(5,16,34,0.88);border:1px solid rgba(247,25,61,0.22);box-shadow:0 0 0 0 rgba(247,25,61,0.18),0 4px 20px rgba(0,0,18,0.6);cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px);">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" stroke="rgba(180,205,235,0.35)" stroke-width="1.2"/>
      <path d="M8 12c0-2.21 1.79-4 4-4s4 1.79 4 4-1.79 4-4 4" stroke="rgba(200,218,242,0.55)" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="2" fill="rgba(185,210,240,0.5)"/>
    </svg>
  </button>

</div><!-- /root -->

<script>
  // ── State ──────────────────────────────────────────────────────
  let activeTab = 'client';

  // ── Tab switching ──────────────────────────────────────────────
  function switchTab(tab) {
    activeTab = tab;
    const clientBtn = document.getElementById('tab-client');
    const teamBtn   = document.getElementById('tab-team');
    const caRow     = document.getElementById('create-account-row');
    if (tab === 'client') {
      clientBtn.style.fontWeight = '700';
      clientBtn.style.color      = '#F5F7FA';
      clientBtn.style.borderBottom = '2px solid #F7193D';
      teamBtn.style.fontWeight   = '400';
      teamBtn.style.color        = 'rgba(145,164,184,0.55)';
      teamBtn.style.borderBottom = '2px solid transparent';
      caRow.classList.add('hidden');
    } else {
      teamBtn.style.fontWeight   = '700';
      teamBtn.style.color        = '#F5F7FA';
      teamBtn.style.borderBottom = '2px solid #F7193D';
      clientBtn.style.fontWeight = '400';
      clientBtn.style.color      = 'rgba(145,164,184,0.55)';
      clientBtn.style.borderBottom = '2px solid transparent';
      caRow.classList.remove('hidden');
      caRow.style.display = 'flex';
    }
  }

  // ── Password visibility ───────────────────────────────────────
  function togglePw() {
    const inp = document.getElementById('password');
    const btn = document.getElementById('show-pw-btn');
    if (inp.type === 'password') { inp.type = 'text';     btn.textContent = 'Hide'; }
    else                         { inp.type = 'password'; btn.textContent = 'Show'; }
  }

  // ── Sign In (demo — just shows error if empty) ────────────────
  function doSignIn() {
    const email = document.getElementById('email').value.trim();
    const pw    = document.getElementById('password').value;
    const err   = document.getElementById('signin-err');
    if (!email || !pw) {
      err.textContent = 'Please enter your work email and password.';
      err.classList.remove('hidden');
    } else {
      err.classList.add('hidden');
      // In the standalone file there's no routing; inform the user.
      alert('Sign-in functionality requires the full app. Open the app at your Vercel URL to sign in.');
    }
  }

  // ── Forgot password ───────────────────────────────────────────
  function showForgotPassword() {
    document.getElementById('login-panel').classList.add('hidden');
    document.getElementById('fp-panel').classList.remove('hidden');
    document.getElementById('fp-panel').style.display = 'flex';
    document.getElementById('card-title').textContent = 'Reset Password';
    document.getElementById('card-sub').textContent   = 'Enter your work email to receive a reset link';
  }

  function showLogin() {
    document.getElementById('fp-panel').classList.add('hidden');
    document.getElementById('login-panel').classList.remove('hidden');
    document.getElementById('card-title').textContent = 'Welcome back';
    document.getElementById('card-sub').textContent   = 'Sign in to your AUDIT 360 workspace';
    document.getElementById('fp-email').value = '';
    document.getElementById('fp-success').classList.add('hidden');
    document.getElementById('fp-send-btn').classList.remove('hidden');
  }

  function sendReset() {
    const email = document.getElementById('fp-email').value.trim();
    if (email) {
      document.getElementById('fp-success').classList.remove('hidden');
      document.getElementById('fp-send-btn').classList.add('hidden');
    }
  }

  // ── Enter Demo ────────────────────────────────────────────────
  function enterDemo() {
    alert('Demo access requires the full app. Open your Vercel URL to use the demo.');
  }

  // ── Parallax on mouse move ────────────────────────────────────
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduced) {
    const bgImg    = document.getElementById('bg-img');
    const midPlane = document.getElementById('mid-plane');
    const fgPlane  = document.getElementById('fg-plane');
    const atmPlane = document.getElementById('atm-plane');
    const cardTilt = document.getElementById('card-tilt');
    const ghost1   = document.getElementById('ghost1');
    const ghost2   = document.getElementById('ghost2');
    const deepP    = document.getElementById('deep-plane');
    const nearP    = document.getElementById('near-plane');

    const target = { x: 0, y: 0 };
    const curr   = { x: 0, y: 0 };

    document.addEventListener('mousemove', e => {
      target.x = e.clientX / window.innerWidth  - 0.5;
      target.y = e.clientY / window.innerHeight - 0.5;
    });

    (function tick() {
      curr.x += (target.x - curr.x) * 0.1;
      curr.y += (target.y - curr.y) * 0.1;
      const cx = curr.x, cy = curr.y;
      if (bgImg)    bgImg.style.transform    = `scale(1.06) translate(${-cx*2}px,${-cy*2}px)`;
      if (midPlane) midPlane.style.transform = `translate(${-cx*5}px,${-cy*3}px)`;
      if (fgPlane)  fgPlane.style.transform  = `translate(${-cx*9}px,${-cy*5}px)`;
      if (atmPlane) atmPlane.style.transform = `translate(${-cx*9}px,${-cy*5}px)`;
      if (deepP)    deepP.style.transform    = `translate(${-cx*1}px,${-cy*1}px)`;
      if (nearP)    nearP.style.transform    = `translate(${-cx*7}px,${-cy*4}px)`;
      if (cardTilt) {
        const rx =  cy * 6, ry = -cx * 6;
        cardTilt.style.transform = `perspective(1400px) rotateX(${rx}deg) rotateY(${ry}deg)`;
      }
      if (ghost1) ghost1.style.transform = `perspective(1400px) rotateX(${cy*4}deg) rotateY(${-cx*4}deg) translate(10px,14px)`;
      if (ghost2) ghost2.style.transform = `perspective(1400px) rotateX(${cy*2.5}deg) rotateY(${-cx*2.5}deg) translate(20px,28px)`;
      requestAnimationFrame(tick);
    })();
  }
</script>
</body>
</html>
